[tool.poetry]
packages = [{ include = "wordle_jz4007", from = "src" }]
name = "wordle_jz4007"
version = "0.1.0"
description = "A Python package that implements the Wordle game logic"
authors = ["Zhang_Jimiao"]
license = "MIT"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry.dependencies]
python = "^3.12"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "sphinx (>=8.2.3,<9.0.0)",
    "myst-parser (>=4.0.1,<5.0.0)",
    "sphinx-autodoc-typehints (>=3.5.2,<4.0.0)",
    "furo (>=2025.9.25,<2026.0.0)",
    "pytest (>=8.4.2,<9.0.0)"
]
